[package]
name = "libvault"
version = "0.4.0"
edition = "2024"
authors = ["Eli Ma <eli@patch.sh>"]
description = "the libvault is modified from RustyVault"
repository = "https://github.com/gitmono-dev/libvault-rs"
build = "build.rs"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.20"
serde = { version = "1.0.229", features = ["derive", "rc", "alloc"] }
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_bytes = "0.11.19"
serde_yaml = "0.9.33"
go-defer = "0.1.0"
rand = "0.10.2"
derivative = "2.2.0"
enum-map = "3.1.0"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
radix_trie = "0.3.0"
lazy_static = "1.5.0"
regex = "1.13.1"
hcl-rs = "0.19.8"
log = "0.4.33"
hex = "0.4.3"
humantime = "2.4.0"
as-any = "0.3.2"
pem = "4.0.0"
chrono = "0.4.45"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
bcrypt = "0.19.3"
url = "2.5.8"
ureq = { version = "3.4.1", features = ["json"] }
reqwest = { version = "0.13.5", features = ["json", "rustls"] }
rustls = "0.24.0-dev.1"
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.9"
glob = "0.3.4"
base64 = { version = "0.22.1", features = ["alloc"] }
ipnetwork = { version = "0.21.1", features = ["serde"] }
blake2b_simd = "1.0.5"
derive_more = { version = "2.1.1", features = ["full"] }
dashmap = "7.0.0-rc2"
better_default = "1.0.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1.92"
stretto = "0.9.0"
priority-queue = "2.7.0"
crossbeam-channel = "0.5.16"
lockfile = "0.4.0"
arc-swap = "1.9.2"
blake3 = "1.8.7"
itertools = "0.15.0"
etcd-client = { version = "0.20.0", features = ["tls"], optional = true }
tracing = "0.1.44"
builder-pattern = "0.4.2"
x509-parser = "0.18.1"
rustls-webpki = "0.104.0-alpha.7"
pgp = "0.20.0"
ssh-key = { version = "0.7.0-rc.11", features = ["std", "crypto", "getrandom"] }
smallvec = "1.16.1"
# `pgp` currently uses rand 0.8/rand_core 0.6 in its public APIs, so the
# RNG passed to it must use that compatible rand_chacha release.
rand_chacha = "0.3.1"
tonic = "0.14.6"
openssl = { version = "0.10.81", optional = true }
openssl-sys = { version = "0.9.117", optional = true }
sqlx = { version = "0.9.0", features = ["runtime-tokio"], optional = true }
tempfile = "3.27.0"

[build-dependencies]
toml = "1.1.6"

[dev-dependencies]
qlean = "0.3.1"

[features]
default = ["crypto_adaptor_openssl"]
storage_xline = ["etcd-client"]
storage_sqlite = ["sqlx/sqlite"]
storage_pg = ["sqlx/postgres"]
crypto_adaptor_openssl = ["dep:openssl", "dep:openssl-sys"]
crypto_adaptor_tongsuo = ["dep:openssl", "dep:openssl-sys"]

[target.'cfg(unix)'.dependencies]
daemonize = "0.5.0"

[dependencies.foreign-types]
version = "0.3.2"

[dependencies.libc]
version = "0.2.189"

[lints.clippy]
result_large_err = "allow"
ptr_arg = "allow"
let_and_return = "allow"
should_implement_trait = "allow"
new_without_default = "allow"
field_reassign_with_default = "allow"
await_holding_lock = "allow"
too_many_arguments = "allow"
collapsible_match = "allow"
large_enum_variant = "allow"
unnecessary_map_or = "allow"
